services:
  - type: web
    name: lykun-static
    runtime: static
    buildCommand: npm ci --ignore-scripts && npm test && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'; frame-ancestors https://web.telegram.org https://*.telegram.org"
      - path: /config.json
        name: Cache-Control
        value: no-store
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /app.js
        name: Cache-Control
        value: no-cache
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
